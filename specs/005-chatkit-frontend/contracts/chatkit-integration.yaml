## Component Specifications

### 1. ChatInterface (Root Component)

```yaml
component: ChatInterface
file: "frontend/components/chat/ChatInterface.tsx"
type: "Client Component"
description: "Root container managing chat state and orchestrating child components"

props:
  initialConversationId:
    type: "string | undefined"
    required: false
    description: "Optional conversation ID to load on mount"

state:
  conversations:
    type: "Conversation[]"
    initial: []
    description: "List of user's conversations"

  activeConversationId:
    type: "string | null"
    initial: null
    description: "Currently selected conversation ID"

  messages:
    type: "Message[]"
    initial: []
    description: "Messages for active conversation"

  input:
    type: "string"
    initial: ""
    description: "Current user input text"

  isLoading:
    type: "boolean"
    initial: false
    description: "Loading state while AI processes message"

  error:
    type: "string | null"
    initial: null
    description: "Error message to display"

hooks:
  - useEffect:
      trigger: "mount"
      action: "Load conversations from API"

  - useEffect:
      trigger: "activeConversationId changes"
      action: "Load messages for selected conversation"

  - useEffect:
      trigger: "messages changes"
      action: "Auto-scroll to bottom"

methods:
  handleSendMessage:
    description: "Send user message to AI agent"
    parameters:
      - name: "content"
        type: "string"
    flow:
      - "Validate input"
      - "Add optimistic user message"
      - "Call apiClient.sendMessage()"
      - "Add assistant response"
      - "Update conversation list if new conversation"
      - "Handle errors"

  handleSelectConversation:
    description: "Switch to different conversation"
    parameters:
      - name: "conversationId"
        type: "string"
    flow:
      - "Set activeConversationId"
      - "Load messages (via useEffect)"

  handleDeleteConversation:
    description: "Delete conversation permanently"
    parameters:
      - name: "conversationId"
        type: "string"
    flow:
      - "Confirm deletion"
      - "Call apiClient.deleteConversation()"
      - "Remove from conversations list"
      - "Clear active conversation if deleted"

  handleCreateConversation:
    description: "Create new conversation"
    flow:
      - "Clear activeConversationId"
      - "Clear messages"
      - "Focus input field"

layout:
  desktop: "Two-column layout (sidebar + chat window)"
  tablet: "Collapsible sidebar"
  mobile: "Single view with navigation toggle"

accessibility:
  - "ARIA labels for all interactive elements"
  - "Keyboard navigation support (Tab, Enter, Escape)"
  - "Screen reader announcements for new messages"
  - "Focus management on conversation switch"

typescript_signature: |
  interface ChatInterfaceProps {
    initialConversationId?: string;
  }

  export function ChatInterface({ initialConversationId }: ChatInterfaceProps): JSX.Element
```

