### 5. MessageBubble

```yaml
component: MessageBubble
file: "frontend/components/chat/MessageBubble.tsx"
type: "Client Component"
description: "Single message bubble (user or assistant)"

props:
  message:
    type: "Message"
    required: true
    description: "Message data to display"

computed:
  isUser:
    value: "message.role === 'user'"
    description: "Whether message is from user"

  toolCalls:
    value: "parseToolCalls(message)"
    description: "Parsed tool calls (if any)"

rendering:
  content:
    source: "message.content"
    formatting: "whitespace-pre-wrap (preserve line breaks)"

  tool_calls:
    condition: "!isUser && toolCalls !== null"
    component: "ToolCallDisplay"

  timestamp:
    source: "message.created_at"
    format: "Time only (e.g., '10:30 AM')"

styling:
  user_message:
    alignment: "justify-end (right-aligned)"
    background: "bg-blue-600"
    text_color: "text-white"
    max_width: "max-w-[70%]"

  assistant_message:
    alignment: "justify-start (left-aligned)"
    background: "bg-gray-100"
    text_color: "text-gray-900"
    max_width: "max-w-[70%]"

  common:
    rounded: "rounded-lg"
    padding: "px-4 py-2"
    margin: "mb-4"

accessibility:
  - "ARIA label='{role} message: {content}'"
  - "Semantic HTML (use <article> or <div> with role)"

typescript_signature: |
  interface MessageBubbleProps {
    message: Message;
  }

  export const MessageBubble = React.memo(function MessageBubble(
    props: MessageBubbleProps
  ): JSX.Element)
```

