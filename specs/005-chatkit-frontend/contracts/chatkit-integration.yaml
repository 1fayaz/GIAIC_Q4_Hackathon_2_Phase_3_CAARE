## Performance Optimization

```yaml
performance:
  code_splitting:
    - "Dynamic import for ToolCallDisplay (not always needed)"
    - "Lazy load conversation list on mobile"

  memoization:
    - "React.memo for MessageBubble"
    - "useMemo for parsed tool calls"
