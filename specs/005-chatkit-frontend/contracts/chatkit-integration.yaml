## State Management Patterns

### Optimistic UI Updates

```yaml
optimistic_updates:
  pattern: "Add message immediately, remove on error"

  implementation:
    - step: 1
      action: "Create optimistic message with temp ID"
      code: |
        const optimisticMessage: Message = {
          id: `temp-${Date.now()}`,
          conversation_id: activeConversationId || 'new',
          role: 'user',
          content: input,
          tool_calls: null,
          created_at: new Date().toISOString()
        };

    - step: 2
      action: "Add to messages array immediately"
      code: |
        setMessages(prev => [...prev, optimisticMessage]);
        setInput('');
        setIsLoading(true);

    - step: 3
      action: "Send to backend"
      code: |
        const response = await apiClient.sendMessage({
          content: optimisticMessage.content,
          conversation_id: activeConversationId || undefined
        });

    - step: 4
      action: "Add assistant response"
      code: |
        const assistantMessage: Message = {
          id: `temp-${Date.now() + 1}`,
          conversation_id: response.conversation_id,
          role: 'assistant',
          content: response.message,
          tool_calls: response.tool_calls ? JSON.stringify(response.tool_calls) : null,
          created_at: new Date().toISOString()
        };
        setMessages(prev => [...prev, assistantMessage]);

    - step: 5
      action: "Handle errors"
      code: |
        catch (error) {
          // Remove optimistic message
          setMessages(prev => prev.filter(m => m.id !== optimisticMessage.id));
          setError('Failed to send message. Please try again.');
        }
```

### Error Recovery

```yaml
error_recovery:
  preserve_input:
    description: "Keep user's message in input field on error"
    implementation: "Don't clear input until successful response"

  retry_mechanism:
    description: "Allow user to retry failed message"
    implementation: "Show 'Retry' button on error"

  error_display:
    description: "Show user-friendly error message"
    implementation: "Use ErrorMessage component from ui/"
```

