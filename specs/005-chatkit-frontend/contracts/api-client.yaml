## Error Handling Specification

### Error Response Format

All error responses follow the standardized format:

```yaml
error_response:
  success:
    type: "boolean"
    value: false
  error:
    type: "object"
    properties:
      code:
        type: "string"
        description: "Error code (e.g., UNAUTHORIZED, VALIDATION_ERROR)"
      message:
        type: "string"
        description: "User-friendly error message"
      details:
        type: "any"
        required: false
        description: "Optional additional error details"
```

### Error Handling Strategy

```yaml
error_handling:
  network_errors:
    description: "Fetch failures, timeouts, connection errors"
    action: "Display user-friendly message, preserve input, allow retry"
    message: "Network error. Please check your connection and try again."

  authentication_errors:
    status: 401
    description: "JWT token expired or invalid"
    action: "Automatic redirect to /signin (handled by api-client.ts)"
    message: "Your session has expired. Please sign in again."

  validation_errors:
    status: 422
    description: "Invalid input data"
    action: "Display validation error, highlight invalid field"
    message: "Invalid input. Please check your message and try again."

  not_found_errors:
    status: 404
    description: "Resource not found or unauthorized access"
    action: "Display error, redirect to conversation list"
    message: "Conversation not found. It may have been deleted."

  server_errors:
    status: 500
    description: "Backend processing errors"
    action: "Display error, preserve input, allow retry"
    message: "Something went wrong. Please try again."

  ai_processing_errors:
    status: 500
    description: "OpenAI API errors or agent failures"
    action: "Display error, preserve input, allow retry"
    message: "AI agent failed to process your message. Please try again."
```

### Retry Policy

```yaml
retry_policy:
  enabled: true
  max_retries: 3
  retry_on_status: [500, 502, 503, 504]
  no_retry_on_status: [400, 401, 403, 404, 422]
  backoff_strategy: "exponential"
  backoff_delays: [1000, 2000, 4000]  # milliseconds

  implementation: |
    async function sendMessageWithRetry(
      request: ChatMessageRequest,
      maxRetries = 3
    ): Promise<ChatMessageResponse> {
      let lastError: Error;

      for (let attempt = 0; attempt < maxRetries; attempt++) {
        try {
          return await apiClient.sendMessage(request);
        } catch (error) {
          lastError = error as Error;

          // Don't retry on client errors (4xx)
          if (error instanceof ApiError && error.status >= 400 && error.status < 500) {
            throw error;
          }

          // Exponential backoff
          const delay = Math.pow(2, attempt) * 1000;
          await new Promise(resolve => setTimeout(resolve, delay));
        }
      }

      throw lastError!;
    }
```

