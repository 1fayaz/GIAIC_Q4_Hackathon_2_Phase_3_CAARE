### 5. deleteConversation

Delete a conversation and all its messages permanently.

```yaml
method: deleteConversation
http_method: DELETE
endpoint: "/conversations/{conversation_id}"
description: "Permanently delete a conversation and all its messages (cascade delete)"

request:
  type: "path_parameters"
  schema:
    conversation_id:
      type: "string"
      required: true
      format: "uuid"
      description: "Conversation identifier"

response:
  success:
    status: 200
    type: "ApiResponse<{ id: string }>"
    schema:
      success:
        type: "boolean"
        value: true
      data:
        type: "object"
        properties:
          id:
            type: "string"
            format: "uuid"
            description: "Deleted conversation ID"
      message:
        type: "string"
        value: "Conversation deleted successfully"

  errors:
    - status: 401
      code: "UNAUTHORIZED"
      message: "Authentication required"
      action: "Redirect to /signin"

    - status: 404
      code: "NOT_FOUND"
      message: "Conversation not found"
      description: "Conversation doesn't exist or doesn't belong to user"

    - status: 500
      code: "INTERNAL_SERVER_ERROR"
      message: "Database error"
      description: "Failed to delete conversation"

typescript_signature: |
  async deleteConversation(conversationId: string): Promise<void>

example_usage: |
  await apiClient.deleteConversation("660e8400-e29b-41d4-a716-446655440001");
  console.log("Conversation deleted successfully");
```

