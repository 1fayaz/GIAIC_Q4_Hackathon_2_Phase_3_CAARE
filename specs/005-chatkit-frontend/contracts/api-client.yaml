## Security Considerations

```yaml
security:
  authentication:
    - "All endpoints require valid JWT token in httpOnly cookie"
    - "Backend validates token on every request"
    - "Expired tokens result in 401 Unauthorized"

  authorization:
    - "Backend enforces user_id filtering on all queries"
    - "Users can only access their own conversations"
    - "Return 404 (not 403) to prevent information leakage"

  input_validation:
    - "Frontend validates input before sending to backend"
    - "Backend performs additional validation (defense in depth)"
    - "Sanitize user input to prevent XSS attacks"

  data_isolation:
    - "Every conversation is scoped to user_id"
    - "Backend filters all queries by current_user.id"
    - "No cross-user data leakage possible"

  error_handling:
    - "Never expose sensitive information in error messages"
    - "Log detailed errors server-side only"
    - "Return user-friendly messages to client"
```

