## Testing Scenarios

### Unit Tests

```yaml
unit_tests:
  - test: "sendMessage with valid input"
    input:
      content: "Add a task to buy groceries"
    expected_output:
      status: 200
      response:
        message: "I've added 'buy groceries' to your task list."
        conversation_id: "660e8400-e29b-41d4-a716-446655440001"

  - test: "sendMessage with empty content"
    input:
      content: "   "
    expected_error:
      status: 422
      code: "VALIDATION_ERROR"
      message: "Message content cannot be empty"

  - test: "getConversations with limit"
    input:
      limit: 10
    expected_output:
      status: 200
      response:
        length: 10
        sorted_by: "updated_at DESC"

  - test: "getConversation with invalid ID"
    input:
      conversation_id: "invalid-uuid"
    expected_error:
      status: 404
      code: "NOT_FOUND"

  - test: "deleteConversation success"
    input:
      conversation_id: "660e8400-e29b-41d4-a716-446655440001"
    expected_output:
      status: 200
      response:
        id: "660e8400-e29b-41d4-a716-446655440001"
```

