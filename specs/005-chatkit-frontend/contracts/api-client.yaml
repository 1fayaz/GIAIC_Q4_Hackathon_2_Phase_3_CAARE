### 2. getConversations

Retrieve all conversations for the authenticated user.

```yaml
method: getConversations
http_method: GET
endpoint: "/conversations"
description: "List user's conversations, ordered by most recent activity"

request:
  type: "query_parameters"
  schema:
    limit:
      type: "number"
      required: false
      default: 50
      min: 1
      max: 100
      description: "Maximum number of conversations to return"

response:
  success:
    status: 200
    type: "ApiResponse<Conversation[]>"
    schema:
      success:
        type: "boolean"
        value: true
      data:
        type: "array"
        items: "Conversation"
        description: "List of conversations (without messages)"
      message:
        type: "string"
        value: "Conversations retrieved successfully"

  errors:
    - status: 401
      code: "UNAUTHORIZED"
      message: "Authentication required"
      action: "Redirect to /signin"

    - status: 422
      code: "VALIDATION_ERROR"
      message: "Invalid limit parameter"
      description: "Limit must be between 1 and 100"

    - status: 500
      code: "INTERNAL_SERVER_ERROR"
      message: "Database error"
      description: "Failed to retrieve conversations"

typescript_signature: |
  async getConversations(limit?: number): Promise<Conversation[]>

example_usage: |
  // Get default 50 conversations
  const conversations = await apiClient.getConversations();
  console.log(conversations.length); // 0-50

  // Get specific limit
  const recentConversations = await apiClient.getConversations(10);
  console.log(recentConversations[0].title); // "Task Management Session"
```

