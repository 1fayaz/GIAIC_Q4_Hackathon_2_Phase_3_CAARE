### 4. createConversation

Create a new conversation with optional title.

```yaml
method: createConversation
http_method: POST
endpoint: "/conversations"
description: "Create a new conversation for the authenticated user"

request:
  type: "ConversationCreateRequest"
  schema:
    title:
      type: "string"
      required: false
      max_length: 100
      validation: "Cannot be empty or whitespace-only if provided"
      description: "Optional conversation title (auto-generated if not provided)"

response:
  success:
    status: 201
    type: "ApiResponse<Conversation>"
    schema:
      success:
        type: "boolean"
        value: true
      data:
        type: "Conversation"
        description: "Newly created conversation (without messages)"
      message:
        type: "string"
        value: "Conversation created successfully"

  errors:
    - status: 401
      code: "UNAUTHORIZED"
      message: "Authentication required"
      action: "Redirect to /signin"

    - status: 422
      code: "VALIDATION_ERROR"
      message: "Invalid title"
      description: "Title validation failed"

    - status: 500
      code: "INTERNAL_SERVER_ERROR"
      message: "Database error"
      description: "Failed to create conversation"

typescript_signature: |
  async createConversation(request?: ConversationCreateRequest): Promise<Conversation>

example_usage: |
  // With title
  const conversation = await apiClient.createConversation({
    title: "Task Management Session"
  });
  console.log(conversation.id); // "660e8400-e29b-41d4-a716-446655440001"
  console.log(conversation.title); // "Task Management Session"

  // Without title (auto-generated)
  const conversation2 = await apiClient.createConversation();
  console.log(conversation2.title); // null (will be set on first message)
```

