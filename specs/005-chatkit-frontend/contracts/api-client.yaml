# API Client Interface Specification

## Overview

This contract defines the TypeScript API client interface for the ChatKit frontend. The client provides type-safe methods for interacting with the Phase 3 backend chat API endpoints.

**Key Requirements**:
- All methods must include authentication credentials (httpOnly cookie)
- All methods must return typed responses matching backend schemas
- All methods must handle errors consistently
- All methods must be async (return Promise)

---
## Base Configuration

```yaml
base_url: "${API_BASE_URL}/api/chat"
authentication:
  type: "cookie"
  cookie_name: "auth_token"
  credentials: "include"
headers:
  Content-Type: "application/json"
  Accept: "application/json"
timeout: 30000  # 30 seconds
retry_policy:
  max_retries: 3
  retry_on: [500, 502, 503, 504]
  backoff: "exponential"
```

---
## API Methods

### 1. sendMessage

Send a user message to the AI agent for conversational task management.

```yaml
method: sendMessage
http_method: POST
endpoint: "/message"
description: "Send a message to the AI agent. Creates new conversation if conversation_id not provided."

request:
  type: "ChatMessageRequest"
  schema:
    content:
      type: "string"
      required: true
      min_length: 1
      max_length: 10000
      validation: "Cannot be empty or whitespace-only"
    conversation_id:
      type: "string"
      required: false
      format: "uuid"
      description: "Optional conversation ID to continue existing conversation"

response:
  success:
    status: 200
    type: "ChatMessageResponse"
    schema:
      message:
        type: "string"
        description: "AI agent's response message text"
      tool_calls:
        type: "array"
        items: "ToolCall"
        required: false
        description: "Optional list of tool invocations performed by the agent"
      conversation_id:
        type: "string"
        format: "uuid"
        description: "Conversation identifier where this exchange occurred"

  errors:
    - status: 401
      code: "UNAUTHORIZED"
      message: "Authentication required"
      action: "Redirect to /signin"

    - status: 404
      code: "NOT_FOUND"
      message: "Conversation not found"
      description: "Conversation_id provided but doesn't exist or doesn't belong to user"

    - status: 422
      code: "VALIDATION_ERROR"
      message: "Invalid input"
      description: "Message content validation failed"

    - status: 500
      code: "INTERNAL_SERVER_ERROR"
      message: "AI agent execution failed"
      description: "OpenAI API error or agent processing error"

typescript_signature: |
  async sendMessage(request: ChatMessageRequest): Promise<ChatMessageResponse>

example_usage: |
  // New conversation
  const response = await apiClient.sendMessage({
    content: "Add a task to buy groceries"
  });
  console.log(response.message); // "I've added 'buy groceries' to your task list."
  console.log(response.conversation_id); // "660e8400-e29b-41d4-a716-446655440001"

  // Continue existing conversation
  const response2 = await apiClient.sendMessage({
    content: "Mark that task as complete",
    conversation_id: "660e8400-e29b-41d4-a716-446655440001"
  });
```

