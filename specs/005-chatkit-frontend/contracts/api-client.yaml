### 3. getConversation

Retrieve a single conversation with full message history.

```yaml
method: getConversation
http_method: GET
endpoint: "/conversations/{conversation_id}"
description: "Get a specific conversation by ID with all messages in chronological order"

request:
  type: "path_parameters"
  schema:
    conversation_id:
      type: "string"
      required: true
      format: "uuid"
      description: "Conversation identifier"

response:
  success:
    status: 200
    type: "ApiResponse<Conversation>"
    schema:
      success:
        type: "boolean"
        value: true
      data:
        type: "Conversation"
        description: "Conversation with messages array populated"
        properties:
          messages:
            type: "array"
            items: "Message"
            description: "Messages in chronological order (oldest first)"
      message:
        type: "string"
        value: "Conversation retrieved successfully"

  errors:
    - status: 401
      code: "UNAUTHORIZED"
      message: "Authentication required"
      action: "Redirect to /signin"

    - status: 404
      code: "NOT_FOUND"
      message: "Conversation not found"
      description: "Conversation doesn't exist or doesn't belong to user"

    - status: 500
      code: "INTERNAL_SERVER_ERROR"
      message: "Database error"
      description: "Failed to retrieve conversation"

typescript_signature: |
  async getConversation(conversationId: string): Promise<Conversation>

example_usage: |
  const conversation = await apiClient.getConversation(
    "660e8400-e29b-41d4-a716-446655440001"
  );
  console.log(conversation.title); // "Task Management Session"
  console.log(conversation.messages?.length); // 10
  console.log(conversation.messages?.[0].content); // "Add a task to buy groceries"
```

