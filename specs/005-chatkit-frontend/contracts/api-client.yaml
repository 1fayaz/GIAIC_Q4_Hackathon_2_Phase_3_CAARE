## Authentication Flow

### JWT Cookie Authentication

```yaml
authentication:
  type: "httpOnly_cookie"
  cookie_name: "auth_token"
  set_by: "Backend (Better Auth)"
  sent_by: "Browser (automatic with credentials: 'include')"

  flow:
    - step: 1
      action: "User signs in via Better Auth"
      result: "Backend sets httpOnly cookie with JWT token"

    - step: 2
      action: "Frontend makes API request"
      result: "Browser automatically includes cookie in request"

    - step: 3
      action: "Backend validates JWT token"
      result: "Extracts user_id from token, enforces data isolation"

    - step: 4
      action: "Backend returns response"
      result: "Data scoped to authenticated user"

  expiration_handling:
    - scenario: "Token expires during chat session"
      detection: "Backend returns 401 Unauthorized"
      action: "api-client.ts automatically redirects to /signin"
      user_experience: "User sees login page, can sign in and resume"

  security_notes:
    - "httpOnly cookie prevents XSS attacks (JavaScript cannot access token)"
    - "credentials: 'include' required for cross-origin requests"
    - "Backend enforces user_id filtering on all queries"
    - "Return 404 (not 403) for unauthorized access to prevent information leakage"
```

