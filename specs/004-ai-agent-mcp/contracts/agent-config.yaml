## Monitoring and Logging

### Metrics to Track

- Tool invocation rate (calls per conversation)
- Tool success rate (successful vs. failed calls)
- Clarification request rate (ambiguous requests)
- Average response length (tokens)
- User satisfaction (implicit: conversation length, task completion)

### Logging Format

```json
{
  "timestamp": "2026-02-08T10:00:00Z",
  "user_id": "uuid",
  "conversation_id": "uuid",
  "message": "user message",
  "agent_response": "agent response",
  "tool_calls": [
    {
      "tool": "add_task",
      "parameters": {"user_id": "uuid", "title": "buy milk"},
      "result": {"task_id": "uuid", "title": "buy milk"},
      "success": true,
      "duration_ms": 150
    }
  ],
  "total_duration_ms": 1200
}
```

