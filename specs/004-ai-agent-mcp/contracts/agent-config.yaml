## Tool Registry Configuration

```yaml
tools:
  - name: add_task
    enabled: true
    required_parameters: [user_id, title]
    optional_parameters: [description]

  - name: list_tasks
    enabled: true
    required_parameters: [user_id]
    optional_parameters: [completed, limit]

  - name: complete_task
    enabled: true
    required_parameters: [user_id, task_id]
    optional_parameters: []

  - name: delete_task
    enabled: true
    required_parameters: [user_id, task_id]
    optional_parameters: []

  - name: update_task
    enabled: true
    required_parameters: [user_id, task_id]
    optional_parameters: [title, description]
```

