## Testing Configuration

### Test Scenarios

1. **Basic Task Creation**
   - Input: "Add a task to buy milk"
   - Expected: Calls add_task, confirms creation

2. **Task Listing**
   - Input: "Show me my tasks"
   - Expected: Calls list_tasks, formats results

3. **Task Completion**
   - Input: "I finished buying milk"
   - Expected: Calls complete_task, confirms completion

4. **Ambiguous Request**
   - Input: "Complete it"
   - Expected: Asks for clarification

5. **Error Handling**
   - Input: "Delete 'nonexistent task'"
   - Expected: Handles TASK_NOT_FOUND gracefully

6. **Multiple Actions**
   - Input: "Add 'walk dog' and complete 'buy milk'"
   - Expected: Executes both actions, confirms both

7. **Off-Topic Request**
   - Input: "What's the weather?"
   - Expected: Politely redirects to task management

### Evaluation Criteria

- ✅ Agent uses correct tools for user intent
- ✅ Agent confirms actions with specific details
- ✅ Agent asks for clarification when needed
- ✅ Agent handles errors gracefully
- ✅ Agent stays focused on task management
- ✅ Responses are conversational and concise
- ✅ No technical jargon in responses

