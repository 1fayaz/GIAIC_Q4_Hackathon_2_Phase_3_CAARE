## Agent Initialization

```python
from openai import OpenAI
from openai.agents import Agent

def create_agent(api_key: str, mcp_tools: list) -> Agent:
    """
    Initialize the task management agent with MCP tools.

    Args:
        api_key: OpenAI API key
        mcp_tools: List of MCP tool definitions

    Returns:
        Configured Agent instance
    """
    client = OpenAI(api_key=api_key)

    agent = Agent(
        client=client,
        model="gpt-4",
        system_prompt=SYSTEM_PROMPT,  # From above
        tools=mcp_tools,
        temperature=0.7,
        max_tokens=500
    )

    return agent
```

---

## Agent Invocation Pattern

```python
async def run_agent(
    agent: Agent,
    user_id: str,
    message: str,
    conversation_history: list[dict]
) -> dict:
    """
    Run the agent with user message and conversation history.

    Args:
        agent: Configured Agent instance
        user_id: Authenticated user ID (injected into tool calls)
        message: Current user message
        conversation_history: List of previous messages [{"role": "user"|"assistant", "content": "..."}]

    Returns:
        {
            "response": str,  # Agent's response message
            "tool_calls": list[dict]  # Tools invoked during processing
        }
    """
    # Inject user_id into tool context
    agent.set_tool_context({"user_id": user_id})

    # Run agent with history + new message
    result = await agent.run(
        message=message,
        history=conversation_history[-50:]  # Limit to last 50 messages
    )

    return {
        "response": result.message,
        "tool_calls": result.tool_calls
    }
```

