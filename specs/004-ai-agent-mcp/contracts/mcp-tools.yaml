## Tool Implementation Guidelines

### Stateless Design
- Tools MUST NOT maintain state between invocations
- All required data MUST be passed as parameters
- Database connection MUST be injected, not stored

### User Ownership Enforcement
```python
async def verify_task_ownership(task_id: UUID, user_id: UUID, db: Session) -> Task:
    task = await db.get(Task, task_id)
    if not task or task.user_id != user_id:
        raise TaskNotFoundError("Task not found or you don't have permission to access it")
    return task
```

### Error Handling Pattern
```python
try:
    # Validate inputs
    if not title or len(title) > 200:
        return {"error": "INVALID_INPUT", "message": "..."}

    # Execute operation
    result = await perform_operation()
    return {"task_id": result.id, ...}

except DatabaseError as e:
    logger.error(f"Database error: {e}")
    return {"error": "DATABASE_ERROR", "message": "Unable to complete operation. Please try again."}

except Exception as e:
    logger.error(f"Unexpected error: {e}")
    return {"error": "INTERNAL_ERROR", "message": "An error occurred. Please try again."}
```

### Logging Pattern
```python
logger.info(f"Tool invoked: {tool_name}", extra={
    "user_id": user_id,
    "tool": tool_name,
    "parameters": parameters,
    "timestamp": datetime.utcnow().isoformat()
})
```

