## Testing Requirements

### Unit Tests (per tool)
- Valid input → success response
- Invalid input → INVALID_INPUT error
- Non-existent task → TASK_NOT_FOUND error
- Database error → DATABASE_ERROR error

### Integration Tests
- Tool invocation through MCP server
- Database persistence verification
- User ownership enforcement

### Security Tests
- Attempt to access other user's task → TASK_NOT_FOUND
- Attempt to modify other user's task → TASK_NOT_FOUND
- Verify all queries filter by user_id

