<!DOCTYPE html>
<html>
<head>
    <title>Auth Test</title>
</head>
<body>
    <h1>Authentication Test</h1>
    <button onclick="testAuth()">Test Authentication</button>
    <pre id="result"></pre>

    <script>
        async function testAuth() {
            const result = document.getElementById('result');
            result.textContent = 'Testing...';
            
            try {
                // Test 1: Health endpoint (no auth required)
                const healthRes = await fetch('http://localhost:8001/health');
                const healthData = await healthRes.json();
                result.textContent = 'Health check: ' + JSON.stringify(healthData, null, 2) + '\n\n';
                
                // Test 2: Tasks endpoint (auth required)
                const tasksRes = await fetch('http://localhost:8001/api/tasks', {
                    credentials: 'include'  // Important: send cookies
                });
                const tasksData = await tasksRes.json();
                result.textContent += 'Tasks endpoint (status ' + tasksRes.status + '):\n';
                result.textContent += JSON.stringify(tasksData, null, 2) + '\n\n';
                
                // Test 3: Conversations endpoint (auth required)
                const convRes = await fetch('http://localhost:8001/api/chat/conversations', {
                    credentials: 'include'  // Important: send cookies
                });
                const convData = await convRes.json();
                result.textContent += 'Conversations endpoint (status ' + convRes.status + '):\n';
                result.textContent += JSON.stringify(convData, null, 2);
                
            } catch (error) {
                result.textContent += 'ERROR: ' + error.message;
            }
        }
    </script>
</body>
</html>
