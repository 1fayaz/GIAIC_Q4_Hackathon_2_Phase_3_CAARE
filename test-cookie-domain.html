<!DOCTYPE html>
<html>
<head>
    <title>Cookie Domain Test</title>
</head>
<body>
    <h1>Authentication Cookie Test</h1>
    <button onclick="testCookie()">Test Cookie</button>
    <pre id="result"></pre>

    <script>
        function testCookie() {
            const result = document.getElementById('result');
            
            // Get all cookies
            const cookies = document.cookie;
            result.textContent = 'All cookies:\n' + cookies + '\n\n';
            
            // Check for auth_token
            const hasAuthToken = cookies.includes('auth_token');
            result.textContent += 'Has auth_token: ' + hasAuthToken + '\n\n';
            
            if (!hasAuthToken) {
                result.textContent += 'ERROR: No auth_token cookie found!\n';
                result.textContent += 'You need to sign in first.\n';
                return;
            }
            
            // Test API call
            result.textContent += 'Testing API call with credentials...\n';
            
            fetch('http://localhost:8001/api/chat/conversations', {
                method: 'GET',
                credentials: 'include',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                result.textContent += 'Status: ' + response.status + '\n';
                return response.json();
            })
            .then(data => {
                result.textContent += 'Response:\n' + JSON.stringify(data, null, 2);
            })
            .catch(error => {
                result.textContent += 'ERROR: ' + error.message;
            });
        }
    </script>
</body>
</html>
